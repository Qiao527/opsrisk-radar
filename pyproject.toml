[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opsrisk-radar"
dynamic = ["version"]
description = "Supply chain disruption monitoring: RSS ingestion, event-based risk scoring with an optional LLM reviewer, and an evaluated ranking"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Zaiqiao Long" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Office/Business :: Financial :: Risk Management",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "feedparser>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
llm = [
    "anthropic>=2.3",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/Qiao527/opsrisk-radar"

[project.scripts]
opsrisk = "opsrisk.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "opsrisk.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opsrisk = ["assets/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",   # long lines are mostly HTML/CSS templates in html_report.py
    "UP017",  # keep timezone.utc for readability
]
